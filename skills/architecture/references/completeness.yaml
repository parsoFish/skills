# Completeness criteria for written registers. Kit defaults; a project overrides per file in docs/architecture/completeness.yaml.
# check: schema | join | date | frequency | agent   (agent = evaluated by the reviewing agent, others by arch check)
risks.md:
  - id: risks.row-schema
    check: schema
    rule: every row has likelihood, impact, trigger, mitigation, owner
  - id: risks.failing-rules
    check: join
    rule: every failing or unenforced rule in fitness has a risk or debt row
  - id: risks.risky-deps
    check: join
    rule: every dependency with risk >= medium has a row
  - id: risks.incidents
    check: agent
    rule: every incident class recorded in signals ("no signal") or the run log has a row
  - id: risks.reviewed
    check: date
    rule: reviewed within 30 days or since the last reflection point
stakeholders.md:
  - id: stakeholders.defaults
    check: schema
    rule: default stakeholders present or struck with a reason — operator, future maintainer, coding agent, reviewing agent, reader, security reviewer, end user
  - id: stakeholders.views-covered
    check: join
    rule: every CHECKLIST view is named by at least one row
  - id: stakeholders.views-exist
    check: join
    rule: every named view exists
  - id: stakeholders.concerns-are-questions
    check: agent
    rule: each concern is a question a person would ask, not a topic
glossary.md:
  - id: glossary.kinds
    check: join
    rule: every element kind used in the model has a term
  - id: glossary.frequent-nouns
    check: frequency
    rule: every capitalised domain noun used three or more times across written docs has a term or is struck
  - id: glossary.mapped
    check: join
    rule: every term maps to a code symbol, file, or ADR
  - id: glossary.retired
    check: join
    rule: no retired term appears
deps.md:
  - id: deps.why
    check: schema
    rule: every direct dependency has a why (inferred from import site or written) and an exit plan ("none, accepted" counts)
  - id: deps.used
    check: join
    rule: no dependency without a production import site
scenarios:
  - id: scenarios.minimum
    check: join
    rule: the kind's minimum count of scenarios exists
  - id: scenarios.gates
    check: join
    rule: every gate in the flow definition appears in at least one scenario
signals.md:
  - id: signals.emitters
    check: join
    rule: every emitter found in code has a sink
  - id: signals.risk-triggers
    check: join
    rule: every risk trigger has a signal or an explicit "no signal" row
