name: skills-ci
on:
  workflow_dispatch:
  push: { branches: [main] }
  pull_request:
jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyyaml
      - run: npm run lint
      - run: npm test
      - name: Strict plugin validation + skill-creator validator (deterministic half of the gate)
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate . --strict
          claude plugin marketplace add anthropics/skills || true
          claude plugin install skill-creator@anthropic-agent-skills || true
          node scripts/gate.mjs --base origin/${{ github.base_ref || 'main' }} --no-agentic
  agentic-gate:
    # Any PR that touches a skill or its evals must pass the agentic gate (plugin eval + structural review). Bounded by --max-cost-usd.
    needs: deterministic
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: changed
        run: |
          base=origin/${{ github.base_ref || 'main' }}
          if git diff --name-only "$base...HEAD" | grep -qE '^(skills|evals)/'; then echo "skills=true" >> "$GITHUB_OUTPUT"; else echo "skills=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.changed.outputs.skills == 'true'
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        if: steps.changed.outputs.skills == 'true'
        with: { python-version: '3.12' }
      - name: Agentic gate (requires ANTHROPIC_API_KEY)
        if: steps.changed.outputs.skills == 'true'
        env: { ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} }
        run: |
          test -n "$ANTHROPIC_API_KEY" || { echo "ANTHROPIC_API_KEY secret missing: the agentic gate cannot run and a skill change must not merge without it"; exit 1; }
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap socat   # sandbox backend for Bash-granting evals
          pip install pyyaml
          npm install -g @anthropic-ai/claude-code
          claude plugin marketplace add anthropics/skills || true
          claude plugin install skill-creator@anthropic-agent-skills || true
          node scripts/gate.mjs --base origin/${{ github.base_ref || 'main' }} --max-cost-usd 10
      - uses: actions/upload-artifact@v4
        if: always() && steps.changed.outputs.skills == 'true'
        with: { name: gate-report, path: evals/gate-report.json }
